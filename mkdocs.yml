site_name: Encrypted SQLite System
site_description: High-performance, AES-128 encrypted SQLite document store and Two-Tier (L1/L2) caching engine for Python.
site_author: Yannis-A-D
site_url: https://yannis-a-d.github.io/encrypted_sqlite_system/

repo_name: Yannis-A-D/encrypted_sqlite_system
repo_url: https://github.com/Yannis-A-D/encrypted_sqlite_system

theme:
  name: material
  palette:
    # Palette toggle for automatic/dark/light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference: api.md
  - CLI Guide: cli.md
